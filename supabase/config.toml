project_id = "altrivo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

# ── Auth ──────────────────────────────────────────────────────────────────
# Mirrors the settings that must also be applied on the hosted project at
# Dashboard → Authentication → Settings (config.toml alone only governs
# `supabase start` local dev; push to a linked hosted project with
# `supabase config push`, or set these fields manually in the Dashboard —
# both are available on the free tier).
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600

# No custom SMTP configured: Supabase's built-in sender handles signup
# confirmation and password-reset emails for free, no domain or
# third-party account needed, and can send to any address. It's
# rate-limited (~2 emails/hour, shared across free-tier projects) and
# meant for testing, not production traffic — revisit Resend (or another
# custom SMTP) once a domain is available, by adding an [auth.email.smtp]
# block here and mirroring it on the hosted project at Dashboard →
# Authentication → Settings → SMTP Settings.
